server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;   # detrás del proxy de Coolify el esquema interno es http: redirigir con ruta relativa (D-049)
  add_header X-Content-Type-Options nosniff always;

  # Enlaces de «universal links» / app links: JSON sin extensión.
  location = /.well-known/apple-app-site-association { default_type application/json; }
  location = /.well-known/assetlinks.json { default_type application/json; }

  # Página del amigo invisible: nunca en caché, sin referrer, sin indexar (equivale a _headers).
  location /s/ {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;
  }
  location = /s { return 301 /s/; }   # conserva el #fragmento en el navegador
  try_files $uri $uri/ =404;
}
